name: CI
on:
  push:
  pull_request:
jobs:
  python-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        working-directory: backend
        run: python -m pip install -e ".[test]" || python -m pip install -e ".[dev]" || python -m pip install -e . pytest
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
  node-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install
        working-directory: frontend
        run: npm ci || npm install
      - name: build
        working-directory: frontend
        run: npm run build
      - name: test
        working-directory: frontend
        run: npm test
