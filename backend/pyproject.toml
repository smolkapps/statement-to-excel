[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statement-to-excel"
version = "1.0.0"
description = "Convert bank-statement PDFs into clean, exact Excel/CSV/JSON spreadsheets — offline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "smolkai" }]
keywords = ["bank statement", "pdf", "excel", "xlsx", "fintech", "extraction"]
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
]

[project.optional-dependencies]
server = ["uvicorn>=0.29"]
test = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.scripts]
statement-to-excel = "statement_to_excel.cli:main"
stx = "statement_to_excel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["statement_to_excel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
